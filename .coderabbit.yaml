# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US
reviews:
  # More nitpicks; surface style and minor issues too.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  # Keep review scoped to source we own. Excludes vendored, generated, and
  # build artifacts so CodeRabbit stops commenting on files outside our work.
  path_filters:
    - "!vendor/**"
    - "!node_modules/**"
    - "!bootstrap/cache/**"
    - "!public/build/**"
    - "!storage/**"
    - "!**/*.lock"
    # CLAUDE.md / AGENTS.md are generated from .ai/guidelines — never reviewed.
    - "!CLAUDE.md"
    - "!AGENTS.md"
  # Suppress endorsed-pattern false positives that recur every run. Mirrors the
  # "Commonly false-positived conventions" registry in
  # .claude/skills/review-pipeline/SKILL.md — add new ones in both places.
  path_instructions:
    - path: "tests/Feature/**"
      instructions: >-
        Do not flag the absence of a per-file `uses(RefreshDatabase::class)` or
        `Http::preventStrayRequests()`. Both are applied globally to the Feature
        suite in tests/Pest.php via
        `pest()->extend(TestCase::class)->use(RefreshDatabase::class)
        ->beforeEach(fn () => Http::preventStrayRequests())->in('Feature')`.
        Per-file declaration is redundant, not a missing safeguard.
    - path: "tests/**"
      instructions: >-
        Do not flag a `// Act & Assert` label as a missing AAA separation. The
        ` & ` collapse is the sanctioned form of this project's AAA standard for
        cases where the act and the assertion are one expression — typically
        `expect(fn () => ...)->toThrow(...)`. The standard is machine-guarded by
        tests/Unit/TestCommentStandardTest.php; splitting these blocks is a
        regression, not an improvement.
    - path: "app/Domains/**/Exceptions/**"
      instructions: >-
        Do not flag third-party account identifiers (ids, usernames, emails)
        embedded in an exception message as PII leakage. These exceptions are
        `report()`ed and never thrown, so the message reaches the operator's log
        only — the user sees generic copy from a lang file. Carrying the detail
        that says which account failed and why is the deliberate design.
  auto_review:
    enabled: true
    # Only auto-review PRs targeting main, so branch-to-branch diffs don't
    # drag in commits outside the PR's actual scope.
    base_branches:
      - "main"
