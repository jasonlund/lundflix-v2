resource_type: workflow
require_status: ready
ending_status: suspended
sort_order: 100
steps:
  # Solo is deliberately absent here. It owns its own project registry and the
  # worktree is added and removed in its UI; nothing in this workflow touches it,
  # so there is no Solo state for `down` to reverse.
  - name: 'Drop MySQL database'
    type: shell
    if: 'test "{{ WORKSPACE_DIR }}" != "{{ PROJECT_PRIMARY_DIR }}"'
    run: 'mysql -h {{ ENV_DB_HOST }} -P {{ ENV_DB_PORT }} -u {{ ENV_DB_USERNAME }} $([[ -z "{{ ENV_DB_PASSWORD }}" ]] && echo "--skip-password" || echo "-p{{ ENV_DB_PASSWORD }}") -e "DROP DATABASE IF EXISTS {{ ENV_DB_DATABASE }}"'
  # LF_SITE is not a stock Laravel key: up's `lf:workspace-env` step writes it
  # into the workspace .env, and the status ladder (up is the only path from
  # suspended to ready, down the only one back) is what guarantees it is there
  # by the time this reads it.
  - name: 'Remove Laravel Herd site'
    type: shell
    if: 'test "{{ WORKSPACE_DIR }}" != "{{ PROJECT_PRIMARY_DIR }}"'
    run: 'herd unlink --no-interaction {{ ENV_LF_SITE }}'
